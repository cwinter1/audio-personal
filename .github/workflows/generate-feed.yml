name: Regenerate feed.xml

on:
  push:
    branches: [main]
    paths:
      - "manifest.json"
      - "audio/**"
      - "scripts/generate_feed.py"
  workflow_dispatch:

jobs:
  regenerate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate feed.xml
        run: python3 scripts/generate_feed.py

      - name: Commit feed.xml if changed
        id: commit
        run: |
          if git diff --quiet feed.xml; then
            echo "feed.xml unchanged"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feed.xml
          git commit -m "Regenerate feed.xml"

          # The mp3-commit and manifest-commit pushes from news's audio_personal_sync
          # land on main a second or so apart, and each independently triggers this
          # workflow (paths: manifest.json / audio/**) -- so two runs regularly race
          # to push the same feed.xml diff. Retry against a fresh fetch+rebase instead
          # of failing the run outright on a losing push.
          max_attempts=5
          attempt=1
          while true; do
            if git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              break
            fi
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "::error::Exhausted $max_attempts push attempts for feed.xml -- giving up."
              exit 1
            fi
            echo "Push rejected (attempt $attempt/$max_attempts) -- fetching and rebasing before retry..."
            git fetch origin main
            git rebase origin/main
            attempt=$((attempt + 1))
          done

      # Pushing to main here doesn't republish GitHub Pages by itself -- Pages
      # only rebuilds on its own page_build event, which follows a push to the
      # branch it's configured to serve. Since this step's commit above is itself
      # a push to main, Pages picks it up automatically; nothing further needed.
